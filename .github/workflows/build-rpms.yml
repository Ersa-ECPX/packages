# Builds the RPMs on GitHub, attaches them to a release and publishes the site: push a tag such as r20261112 and everything follows.
#
#   git tag r20261112 && git push origin r20261112
#
# or run the workflow by hand (Actions > Build and publish packages > Run workflow) and give the tag, which it creates on the chosen
# commit. The steps:
#   build    every package in an openSUSE Tumbleweed container (scripts/build-repo-podman). The container takes its packages from
#            openSUSE's own build servers, not from the download.opensuse.org redirector: the redirector sent an earlier attempt to a
#            mirror that was mid-sync ("File appdata.xml.gz not found on medium") and every run failed.
#   release  creates the GitHub release with the RPMs (and source RPMs) attached, so each version stays downloadable.
#   publish  runs pages.yml for that release: signs, builds the repository and deploys https://pkgs-compute.ersa.dev .
#
# NOT RUN YET. What is verified: scripts/build-repo, run in a local Tumbleweed container, built `foundation` and `ersa-boot-splash`.
# Unverified: this file, the compiled packages in a runner, and the hand-over to pages.yml. A package whose spec downloads a source
# (foundation: the tag v<Version> of the foundation repository; ersa-bluetooth and ersa-dialer: the pinned commit) fails when that
# source does not exist, so tag foundation before the packages that need it.
name: Build and publish packages

on:
  push:
    tags: ["r[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example r20261112"
        required: true

concurrency:
  group: build-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "unusable tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build every package in a Tumbleweed container
        env:
          OPENSUSE_MIRROR: https://provo-mirror.opensuse.org
        run: scripts/build-repo-podman rpms

      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: rpms/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: rpms
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          notes="RPMs for openSUSE Tumbleweed:"$'\n\n'
          for file in rpms/*.rpm; do notes+="- $(basename "$file")"$'\n'; done
          notes+=$'\n'"Published at https://pkgs-compute.ersa.dev."
          gh release create "$TAG" rpms/*.rpm --repo "$REPOSITORY" --target "$GITHUB_SHA" \
            --title "Packages $TAG" --notes "$notes"

  publish:
    needs: [build, release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
